name: "Docker Build & Test"

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # In this step, this action saves a list of existing images,
      # the cache is created without them in the post run.
      # It also restores the cache if it exists.
      - uses: satackey/action-docker-layer-caching@v0.0.11
        # Ignore the failure of a step and avoid terminating the job.
        continue-on-error: true

      - name: Build docker image
        run: docker build -t bitcoin-vault-api-ci .

      - name: Run offline regression tests in the built image
        run: >-
          docker run --rm --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 128 --memory 256m --cpus 1
          --mount "type=bind,source=${{ github.workspace }}/tests,target=/tests,readonly"
          --entrypoint python bitcoin-vault-api-ci
          -B -m unittest discover -s /tests -p 'test_*.py' -v

