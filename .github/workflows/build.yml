name: "Docker Build & Test"

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # In this step, this action saves a list of existing images,
      # the cache is created without them in the post run.
      # It also restores the cache if it exists.
      - uses: satackey/action-docker-layer-caching@v0.0.11
        # Ignore the failure of a step and avoid terminating the job.
        continue-on-error: true

      - name: Build docker image
        run: docker build -t bitcoin-vault-api-ci .

      - name: Exercise full and selective release recipes without registry credentials
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/test_pr_recipes.sh "$PR_BASE_SHA"

      - name: Run offline regression tests in the built image
        run: >-
          docker run --rm --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 128 --memory 256m --cpus 1
          --mount "type=bind,source=${{ github.workspace }}/tests,target=/tests,readonly"
          --entrypoint python bitcoin-vault-api-ci
          -B -m unittest discover -s /tests -p 'test_*.py' -v

      - name: Run daemon restart regression with standalone MongoDB
        env:
          MONGO_IMAGE: mongo:6.0.3@sha256:db616c3ceb0a82837d8ad6382ee93aff4fae89f9b7ad37b3e6c07f35f1559345
        run: |
          docker pull "$MONGO_IMAGE"
          python3 -B tests/run_daemon_recovery.py worktree --runtime-image bitcoin-vault-api-ci --mongo-image "$MONGO_IMAGE"

