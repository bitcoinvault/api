name: "Release"

on:
  push:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: api-image-publication
  cancel-in-progress: false

env:
  ECR_REPOSITORY: api
  IMAGE_TAG: ${{ github.sha }}
  BUILD_NAME: bitcoin-vault-api-build-${{ github.run_id }}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.CI_DEPLOYER_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_DEPLOYER_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.CI_DEPLOYER_AWS_ROLE_TO_ASSUME }}
          allowed-account-ids: "401615164202"
          unset-current-credentials: true
          retry-max-attempts: 3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ecr-publish

      - name: Build and test application image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ecr-publish
        run: |
          docker build --file Dockerfile.release --network none \
            --label "org.opencontainers.image.revision=$IMAGE_TAG" -t "$BUILD_NAME" .
          python3 .github/scripts/verify_image.py "$BUILD_NAME"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 256m --cpus 1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests,target=/tests,readonly" \
            --entrypoint python "$BUILD_NAME" -B -m unittest discover -s /tests -p 'test_*.py' -v

      - name: Publish verified image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DOCKER_CONFIG: ${{ runner.temp }}/ecr-publish
        run: python3 .github/scripts/publish_image.py
